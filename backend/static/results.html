<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PolicyLens • Assessment Results Dashboard</title>
  <link rel="icon" href="policy-lens.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-primary: #070913;
      --bg-card: rgba(15, 23, 42, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(99, 102, 241, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-blue: #3b82f6;
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    html.light {
      --bg-primary: #f8fafc;
      --bg-card: rgba(255, 255, 255, 0.9);
      --border-subtle: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 32px;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 24px;
      backdrop-filter: blur(20px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="policy-lens.png" alt="PolicyLens" style="width: 36px; height: 36px;" onerror="this.src='policy%20lens.png'" />
        <h1 style="font-family: var(--font-display); font-size: 24px; font-weight: 800;">PolicyLens Results</h1>
      </div>
      <a href="index.html" class="btn-back">
        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
        Return to Studio
      </a>
    </div>

    <div id="contentBlock" class="card">
      <p style="color: var(--text-muted); font-size: 15px;">Redirecting to unified interactive studio...</p>
    </div>
  </div>

  <script>
    // Seamless redirect to unified studio or load session data
    window.addEventListener('DOMContentLoaded', () => {
      const data = sessionStorage.getItem('analysisResults');
      if (data) {
        window.location.replace('index.html');
      } else {
        document.getElementById('contentBlock').innerHTML = `
          <h2 style="font-family: var(--font-display); font-size: 20px; margin-bottom: 12px;">No Active Analysis Found</h2>
          <p style="color: var(--text-muted); margin-bottom: 20px;">Please open the studio to upload a policy document or run an interactive demo.</p>
          <a href="index.html" class="btn-back" style="background: #4285F4; color: #fff; border: none; padding: 12px 24px;">Launch PolicyLens Studio</a>
        `;
      }
    });
  </script>
</body>
</html>
